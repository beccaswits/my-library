<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Library</title>
<style>
:root{--ink:#e8dfc8;--gold:#c7a86b;--green:#102b24;--green2:#173a30;--wood:#3a2418;--wood2:#6a4028;--paper:#eee5d1}*{box-sizing:border-box}body{margin:0;background:#081b17;color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;background-image:radial-gradient(circle at 70% 5%,#31544355,transparent 28%),linear-gradient(#0a201a,#071511)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{padding:28px 20px;border-right:1px solid #b99b6038;background:#0c251fdd;position:sticky;top:0;height:100vh}.brand{font-size:28px;color:#eadcb8;margin-bottom:6px}.sub{font-size:12px;letter-spacing:2px;color:#a99772;margin-bottom:32px}.nav button{width:100%;text-align:left;padding:12px 14px;margin:5px 0;border:0;border-radius:8px;background:transparent;color:#cfc4a8;cursor:pointer}.nav button.active,.nav button:hover{background:#b89c6322;color:#f2e6c5}.plant{font-size:52px;margin-top:40px;text-align:center;filter:drop-shadow(0 4px 8px #000)}main{padding:26px 34px 60px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.top h1{margin:0 auto 0 0;font-size:31px;font-weight:normal}.search,.select{background:#102a23;border:1px solid #8f7a4d66;color:#eee0bd;border-radius:20px;padding:9px 14px}.search{min-width:240px}.bookcase{border:12px solid #40291c;border-radius:8px;background:linear-gradient(90deg,#27170f,#4b2d1c 7%,#342014 50%,#4b2d1c 93%,#27170f);box-shadow:0 18px 45px #0009,inset 0 0 30px #0008;padding:22px 22px 0;position:relative}.arch{height:110px;margin:-10px -4px 10px;border-radius:120px 120px 0 0;background:radial-gradient(ellipse at center bottom,#5e795f55,#142d25 65%);border:1px solid #b79a5c35;display:flex;align-items:center;justify-content:center;overflow:hidden}.arch:before{content:'MY CONSERVATORY LIBRARY';letter-spacing:5px;font-size:14px;color:#cbb47e}.shelf{height:205px;display:flex;align-items:flex-end;padding:0 16px 0;gap:2px;border-bottom:18px solid #6b4329;box-shadow:0 10px 10px #120a07,inset 0 -10px 20px #0005;overflow:hidden;position:relative}.book{flex:0 0 auto;border:0;border-radius:3px 3px 0 0;color:#eee4ca;padding:8px 4px 4px;writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);letter-spacing:.4px;font-size:12px;box-shadow:inset 2px 0 #ffffff12,inset -2px 0 #0003,2px 1px 4px #0007;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.18s;margin-bottom:0}.book:hover{transform:rotate(180deg) translateY(8px);filter:brightness(1.2)}.decor{font-size:44px;align-self:flex-end;padding:0 8px 0;filter:drop-shadow(2px 5px 4px #0008)}.hint{text-align:center;color:#9d8c68;font-size:12px;margin:17px}.panel{position:fixed;right:0;top:0;width:min(390px,92vw);height:100vh;background:#102a23f7;border-left:1px solid #b79b61;box-shadow:-15px 0 40px #000a;padding:28px;z-index:5;transform:translateX(105%);transition:.25s;overflow:auto}.panel.open{transform:none}.close{float:right;background:none;border:0;color:#e7d8b5;font-size:25px;cursor:pointer}.cover{height:245px;width:160px;margin:20px auto;background:linear-gradient(145deg,#5c3b2c,#172f28);border:5px solid #d0b87b;box-shadow:0 10px 20px #0008;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#f1dfad;font-size:22px}.panel h2{text-align:center;font-weight:normal;color:#f1e3bd}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.chip{background:#203c32;border:1px solid #927e5266;padding:9px;border-radius:6px;font-size:13px}.notes{width:100%;min-height:110px;background:#e9dfc9;color:#33291f;border:0;border-radius:5px;padding:12px}.stars{color:#dfbd63;text-align:center;font-size:21px}.empty{padding:50px;text-align:center;color:#b5a783}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#122d25;border:1px solid #8e794c44;border-radius:8px;padding:18px}.card b{color:#e6d5ad}.stat{font-size:38px;color:#d0b36e}.vine{position:absolute;right:2%;top:100px;font-size:70px;z-index:2;pointer-events:none}@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid #b99b6038;padding:16px}.brand,.sub{text-align:center}.sub{margin-bottom:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.plant{display:none}main{padding:18px 10px}.top h1{width:100%}.search{min-width:0;flex:1}.bookcase{padding:12px 5px 0;border-width:7px}.shelf{height:180px;padding-left:5px;padding-right:5px}.arch{height:75px}.arch:before{font-size:10px;letter-spacing:2px}.vine{display:none}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">My Library</div><div class="sub">BECCA'S COLLECTION</div><nav class="nav"><button class="active" data-view="shelf">▥ My Shelf</button><button data-view="library">⌕ Library</button><button data-view="wishlist">♡ Wishlist</button><button data-view="stats">◌ Stats</button></nav><div class="plant">🪴</div></aside><main><section id="shelf" class="view active"><div class="top"><h1>My Shelf</h1><input id="search" class="search" placeholder="Search your shelves…"><select id="sort" class="select"><option value="custom">Custom order</option><option value="title">Title A–Z</option><option value="author">Author A–Z</option><option value="genre">Genre</option><option value="physicalFirst">Format — Physical first</option><option value="digitalFirst">Format — Digital first</option></select></div><div class="bookcase"><div class="arch"></div><div class="vine">🌿</div><div id="shelves"></div></div><div class="hint">Click a spine to open the book · Drag a book anywhere — including between shelves</div></section><section id="library" class="view"><div class="top"><h1>Library</h1><input id="libsearch" class="search" placeholder="Search books, authors, genres…"></div><div id="cards" class="cards"></div></section><section id="wishlist" class="view"><div class="top"><h1>Wishlist</h1></div><div class="empty">♡ Your future book haul will live here.</div></section><section id="stats" class="view"><div class="top"><h1>Library Stats</h1></div><div class="cards"><div class="card"><div class="stat" id="total">0</div>Books in this prototype</div><div class="card"><div class="stat">🌿</div>Conservatory mode: thriving</div><div class="card"><div class="stat" id="readCount">0</div>Books read</div></div></section></main></div><aside id="panel" class="panel"><button class="close" id="close">×</button><div class="cover" id="cover"></div><h2 id="ptitle"></h2><div class="stars" id="rating"></div><div class="meta" id="meta"></div><label>My Notes</label><textarea class="notes" id="notes" placeholder="Thoughts, favorite quotes, unhinged reactions…"></textarea></aside>
<script>
const books=[{id:1,title:'Fourth Wing',author:'Rebecca Yarros',genre:'Romantasy',format:'Hardcover',read:true,rating:5,spice:3,color:'#563329'},{id:2,title:'The Secret History',author:'Donna Tartt',genre:'Dark Academia',format:'Paperback',read:true,rating:5,spice:0,color:'#233a32'},{id:3,title:'Divine Rivals',author:'Rebecca Ross',genre:'Romantasy',format:'Kindle/eBook',read:true,rating:4,spice:1,color:'#74543b'},{id:4,title:'A Court of Thorns and Roses',author:'Sarah J. Maas',genre:'Romantasy',format:'Kindle/eBook',read:true,rating:4,spice:3,color:'#25483d'},{id:5,title:'The Very Secret Society of Irregular Witches',author:'Sangu Mandanna',genre:'Cozy Fantasy',format:'Kindle/eBook',read:false,rating:0,spice:1,color:'#6a3f35'},{id:6,title:'The Invisible Life of Addie LaRue',author:'V. E. Schwab',genre:'Fantasy',format:'Hardcover',read:true,rating:5,spice:1,color:'#25343a'},{id:7,title:'Emily Wilde’s Encyclopaedia of Faeries',author:'Heather Fawcett',genre:'Fantasy',format:'Paperback',read:false,rating:0,spice:0,color:'#526146'},{id:8,title:'Book Lovers',author:'Emily Henry',genre:'Romance',format:'Kindle/eBook',read:true,rating:4,spice:2,color:'#7a493d'},{id:9,title:'The Cruel Prince',author:'Holly Black',genre:'Fantasy',format:'Paperback',read:true,rating:4,spice:1,color:'#3d563c'},{id:10,title:'One Dark Window',author:'Rachel Gillig',genre:'Gothic Fantasy',format:'Hardcover',read:true,rating:5,spice:2,color:'#3c3035'},{id:11,title:'The Ex Hex',author:'Erin Sterling',genre:'Romance',format:'Kindle/eBook',read:true,rating:4,spice:3,color:'#704a34'},{id:12,title:'Ninth House',author:'Leigh Bardugo',genre:'Dark Academia',format:'Hardcover',read:false,rating:0,spice:0,color:'#273d35'},{id:13,title:'The Spellshop',author:'Sarah Beth Durst',genre:'Cozy Fantasy',format:'Kindle/eBook',read:false,rating:0,spice:0,color:'#815d45'},{id:14,title:'Funny Story',author:'Emily Henry',genre:'Romance',format:'Paperback',read:true,rating:4,spice:2,color:'#7a493d'},{id:15,title:'Belladonna',author:'Adalyn Grace',genre:'Gothic Fantasy',format:'Hardcover',read:true,rating:4,spice:1,color:'#563944'},{id:16,title:'Legends & Lattes',author:'Travis Baldree',genre:'Cozy Fantasy',format:'Paperback',read:true,rating:5,spice:0,color:'#684333'},{id:17,title:'The Familiar',author:'Leigh Bardugo',genre:'Fantasy',format:'Hardcover',read:false,rating:0,spice:1,color:'#314d44'},{id:18,title:'Beach Read',author:'Emily Henry',genre:'Romance',format:'Kindle/eBook',read:true,rating:4,spice:2,color:'#7b5540'}];
let order=JSON.parse(localStorage.getItem('bookOrder')||'null')||books.map(b=>b.id);let notes=JSON.parse(localStorage.getItem('bookNotes')||'{}');let dragged=null;function ordered(){return order.map(id=>books.find(b=>String(b.id)===String(id))).filter(Boolean)}function renderShelves(){let q=document.querySelector('#search').value.toLowerCase();let mode=document.querySelector('#sort').value;let list=ordered().filter(b=>(b.title+' '+b.author+' '+b.genre).toLowerCase().includes(q));if(mode!=='custom')list.sort((a,b)=>(a[mode]||'').localeCompare(b[mode]||''));let root=document.querySelector('#shelves');root.innerHTML='';for(let s=0;s<3;s++){let sh=document.createElement('div');sh.className='shelf';list.slice(s*6,s*6+6).forEach((b,i)=>{let el=document.createElement('button');el.className='book';el.draggable=true;el.dataset.id=b.id;el.textContent=b.title;el.style.background=b.color;el.style.height=(135+(Number(String(b.id).replace(/\D/g,''))||1)*13)%50+135+'px';el.style.width=(28+(Number(String(b.id).replace(/\D/g,''))||1)*7)%16+28+'px';el.onclick=()=>openBook(b);el.ondragstart=()=>dragged=b.id;el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(dragged&&String(dragged)!==String(b.id)){let a=order.findIndex(x=>String(x)===String(dragged)),z=order.findIndex(x=>String(x)===String(b.id));order.splice(a,1);order.splice(z,0,dragged);localStorage.setItem('bookOrder',JSON.stringify(order));renderShelves()}};sh.appendChild(el)});root.appendChild(sh)}}
function openBook(b){document.querySelector('#panel').classList.add('open');document.querySelector('#cover').textContent=b.title;document.querySelector('#ptitle').textContent=b.title+' — '+b.author;document.querySelector('#rating').textContent=(b.rating?'★'.repeat(b.rating)+'☆'.repeat(5-b.rating):'Not rated yet');document.querySelector('#meta').innerHTML=`<div class="chip">${b.genre}</div><div class="chip">${b.format}</div><div class="chip">${b.read?'✓ Read':'○ Unread'}</div><div class="chip">🌶️ ${b.spice}/5</div>`;let n=document.querySelector('#notes');n.value=notes[b.id]||'';n.oninput=()=>{notes[b.id]=n.value;localStorage.setItem('bookNotes',JSON.stringify(notes))}}function renderCards(){let q=document.querySelector('#libsearch').value.toLowerCase();document.querySelector('#cards').innerHTML=ordered().filter(b=>(b.title+b.author+b.genre+b.format).toLowerCase().includes(q)).map(b=>`<div class="card" data-book-id="${b.id}"><b>${b.title}</b><br><small>${b.author}</small><p>${b.genre} · ${b.format}</p></div>`).join('');document.querySelectorAll('#cards .card[data-book-id]').forEach(c=>c.onclick=()=>openBook(books.find(x=>String(x.id)===String(c.dataset.bookId))))}document.querySelectorAll('.nav button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelector('#'+btn.dataset.view).classList.add('active');if(btn.dataset.view==='library')renderCards()});document.querySelector('#close').onclick=()=>document.querySelector('#panel').classList.remove('open');document.querySelector('#search').oninput=renderShelves;document.querySelector('#sort').onchange=renderShelves;document.querySelector('#libsearch').oninput=renderCards;document.querySelector('#total').textContent=books.length;document.querySelector('#readCount').textContent=books.filter(b=>b.read).length;renderShelves();
</script><script src="book-customize.js"></script><script src="library-name.js"></script><script src="book-manager.js"></script><script src="book-actions.js"></script><script src="shelf-reorder.js"></script><script src="imported-books.js?v=2"></script><script src="decor-realistic.js?v=4"></script><script src="shelf-drag.js?v=7"></script><script src="library-backup.js?v=1"></script><script src="library-organize.js?v=1"></script><script src="stats-reading.js?v=1"></script></body></html>
